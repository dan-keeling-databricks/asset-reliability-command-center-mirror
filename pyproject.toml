[project]
name = "asset-reliability-command-center"
version = "0.2.0"
description = "Live asset reliability command center for Databricks Apps"
requires-python = ">=3.11"
dependencies = [
  "databricks-sdk>=0.65.0,<1",
  "fastapi>=0.115.0,<1",
  "httpx>=0.28.0,<1",
  "psycopg[binary,pool]>=3.2.0,<4",
  "pydantic-settings>=2.7.0,<3",
  "uvicorn[standard]>=0.34.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.25.0,<1",
  "ruff>=0.11.0,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/producer/pump_telemetry_producer.py" = ["F821"]
"src/streaming/kafka_to_lakebase_rtm.py" = ["F821"]
